<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Lista de Clientes</h2>
    <button class="btn btn-primary" (click)="novo()">Novo Cliente</button>
  </div>

  <table mat-table [dataSource]="clientes" class="mat-elevation-z8 w-100">

    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef> Nome </th>
      <td mat-cell *matCellDef="let cliente"> {{ cliente.nome }} </td>
    </ng-container>

    <ng-container matColumnDef="documento">
      <th mat-header-cell *matHeaderCellDef> Documento </th>
      <td mat-cell *matCellDef="let cliente"> {{ cliente.documento }} </td>
    </ng-container>

    <ng-container matColumnDef="tipoPessoa">
      <th mat-header-cell *matHeaderCellDef> tipoPessoa </th>
      <td mat-cell *matCellDef="let cliente"> {{ cliente.tipoPessoa }} </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> email </th>
      <td mat-cell *matCellDef="let cliente"> {{ cliente.email }} </td>
    </ng-container>

    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef> Ações </th>
      <td mat-cell *matCellDef="let cliente">
        <button class="btn btn-sm btn-warning me-2" (click)="editar(cliente.id)">Editar</button>
        <button class="btn btn-sm btn-danger" (click)="excluir(cliente.id)">Excluir</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
